<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PetMate</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">PetMate</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button id="logoutBtn" class="btn btn-outline-primary">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container mt-5 mb-5">
        <div class="card">
            <div class="card-body text-center py-5">
                <h1 class="mb-4">Welcome to PetMate 🐾</h1>
                <p class="text-secondary-custom mb-4">
                    You're successfully logged in! This is your dashboard.
                </p>
                <p class="text-secondary-custom">
                    More features coming soon...
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="mb-0">PetMate – University Project</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Dashboard Logic -->
    <script>
        // Check if user is logged in via session
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                // Check if user has valid session by calling status endpoint
                const response = await fetch('/api/user/status', {
                    method: 'GET',
                    credentials: 'include' // Include cookies for session
                });
                
                if (!response.ok) {
                    // No valid session, redirect to login
                    window.location.href = 'login.html';
                    return;
                }
                
                const data = await response.json();
                
                // If status is not active, redirect accordingly
                if (data.status === 'pending') {
                    window.location.href = 'status.html';
                } else if (data.status === 'blocked') {
                    alert('Your account has been blocked. Please contact support.');
                    window.location.href = 'login.html';
                } else if (data.status !== 'active') {
                    window.location.href = 'login.html';
                }
                // If status is active, user can stay on dashboard
            } catch (error) {
                console.error('Error checking session:', error);
                // On error, redirect to login
                window.location.href = 'login.html';
            }
        });
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                // Call logout API endpoint
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                // Clear localStorage
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userStatus');
                
                // Redirect to homepage
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Logout error:', error);
                // Even if logout fails, clear local storage and redirect
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userStatus');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
